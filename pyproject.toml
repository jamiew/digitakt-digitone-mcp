[project]
name = "digitakt-midi-mcp"
version = "0.1.0"
description = "MCP Server for controlling Elektron Digitakt (original) via MIDI"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "mido>=1.3.0",
    "python-rtmidi>=1.5.0",
    "mcp>=0.9.0",
]

[project.scripts]
digitakt-midi = "digitakt_midi:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[dependency-groups]
dev = []
