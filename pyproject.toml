[project]
name = "digitakt-digitone-mcp"
version = "0.4.0"
description = "MCP servers for controlling Elektron Digitakt and Digitone over MIDI"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Jamie Dubs" }]
keywords = ["mcp", "midi", "elektron", "digitakt", "digitone", "music"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Sound/Audio :: MIDI",
]
dependencies = [
    "mido>=1.3.3",
    "python-rtmidi>=1.5.8",
    "mcp>=2.3.0,<3",
]

[project.urls]
Homepage = "https://github.com/jamiew/digitakt-digitone-mcp"
Issues = "https://github.com/jamiew/digitakt-digitone-mcp/issues"

[project.scripts]
digitakt-mcp = "elektron_mcp.devices.digitakt:main"
digitone-mcp = "elektron_mcp.devices.digitone:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/elektron_mcp"]

[dependency-groups]
dev = [
    "ruff>=0.17.3",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "ty>=0.0.93",
]
# The live LLM test harness in harness/. Not needed to run the MCP servers.
harness = [
    "anthropic>=2.3.0",
    "openai>=3.40.0",
    "python-dotenv>=1.2.4",
]

[tool.uv]
default-groups = ["dev", "harness"]

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["src", "tests", "harness"]
# Legacy manual hardware scripts, kept for reference but not held to package standards.
extend-exclude = ["scripts/hardware"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
    "PTH",  # prefer pathlib
    "TID",  # tidy imports
]
ignore = [
    "E501",   # line length is handled by the formatter
    "B008",   # function call in default arg — required by FastMCP's Annotated defaults
    "SIM108", # ternaries are not always more readable
]

[tool.ruff.lint.per-file-ignores]
# Parameter tables are generated-ish data; long literal dicts are fine.
"src/elektron_mcp/devices/*_params.py" = ["E501"]
"src/elektron_mcp/devices/*_cc.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_default_fixture_loop_scope = "function"
addopts = "--strict-markers -q"

[tool.ty.src]
include = ["src", "harness"]
